<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>해외주문 발송 처리</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #1d222a;
    --border: #2a3038;
    --text: #e6e9ee;
    --text-dim: #8a919c;
    --accent: #4fa3ff;
    --dhl: #ffb020;
    --domestic: #2ecc71;
    --danger: #ff5d5d;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header h1 .sub {
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 8px;
    font-size: 12px;
  }
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
    gap: 16px;
  }
  #login-screen p { color: var(--text-dim); margin: 0; }
  main { padding: 20px 24px; display: none; }
  main.visible { display: block; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    font-size: 13px;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--panel-2);
    font-size: 11px;
    color: var(--text-dim);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0f1216; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--panel); }
  td { padding: 10px; vertical-align: top; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.dhl { background: rgba(255,176,32,0.15); color: var(--dhl); }
  .badge.domestic { background: rgba(46,204,113,0.15); color: var(--domestic); }
  .badge.unknown { background: rgba(138,145,156,0.15); color: var(--text-dim); }

  .order-no { font-family: var(--mono); font-weight: 600; }
  .items-list { color: var(--text-dim); font-size: 12px; line-height: 1.6; }
  .items-list .sku { font-family: var(--mono); color: var(--text); }
  .items-list .no-sku { color: var(--danger); }

  .addr-box { font-size: 12px; color: var(--text-dim); max-width: 220px; }
  .addr-box .edit-btn { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 4px; display: inline-block; }

  .note-badge {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 4px;
    max-width: 200px;
  }

  input[type="text"], input[type="number"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 12px;
    width: 130px;
  }
  input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

  .status-msg { font-size: 12px; margin-top: 6px; }
  .status-msg.ok { color: var(--domestic); }
  .status-msg.err { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.visible { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    width: 420px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-box h2 {
    font-size: 15px;
    margin: 0 0 16px;
  }
  .modal-box .field-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .modal-box .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .modal-box label {
    font-size: 11px;
    color: var(--text-dim);
  }
  .modal-box input[type="text"] {
    width: 100%;
  }
  .modal-box .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  .modal-box .modal-error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 8px;
  }

  .origin-modal-box {
    width: 640px;
  }
  .origin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .origin-table th, .origin-table td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .origin-table input[type="text"] {
    width: 70px;
    text-transform: uppercase;
  }
  .origin-table tr.missing input { border-color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>해외주문 발송 처리 <span class="sub">GEONWORKS</span></h1>
  <div id="user-info" style="display:none; align-items:center; gap:10px; font-size:12px; color:var(--text-dim);">
    <span id="user-email"></span>
    <button id="logout-btn">로그아웃</button>
  </div>
</header>

<div id="login-screen">
  <p>@geon.works 계정으로 로그인해주세요</p>
  <div id="g_id_signin"></div>
</div>

<main id="main">
  <div class="tabs">
    <div class="tab active" data-tab="dhl">DHL 발송건 <span class="count" id="count-dhl">0</span></div>
    <div class="tab" data-tab="domestic">국내 배송건 <span class="count" id="count-domestic">0</span></div>
    <div class="tab" data-tab="groupbuy">Group Buy (제외됨) <span class="count" id="count-groupbuy">0</span></div>
    <div class="tab" data-tab="processed">처리완료 조회</div>
  </div>

  <div class="toolbar">
    <button id="refresh-btn">↻ 새로고침</button>
    <span id="last-updated" style="font-size:12px; color:var(--text-dim);"></span>
  </div>

  <div id="dhl-toolbar" class="toolbar" style="display:none; flex-wrap:wrap;">
    <label style="font-size:12px; color:var(--text-dim);">DHL 리포트 업로드:</label>
    <input type="file" id="dhl-report-input" accept=".xlsx" />
    <span id="dhl-report-status" style="font-size:12px; color:var(--text-dim);"></span>
    <button id="dhl-process-btn" class="primary">선택 주문 발송처리+재고차감</button>
    <button id="dhl-export-btn">출고분/GMI 엑셀 생성</button>
  </div>
  <div id="dhl-log" style="font-size:12px; margin-bottom:10px;"></div>

  <div id="table-container">
    <div class="loading">로그인 후 주문을 불러옵니다...</div>
  </div>
</main>

<div id="address-modal" class="modal-overlay">
  <div class="modal-box">
    <h2>배송 주소 수정 — <span id="modal-order-no"></span></h2>
    <div class="field-row">
      <div class="field">
        <label>성</label>
        <input type="text" id="f-lastName" />
      </div>
      <div class="field">
        <label>이름</label>
        <input type="text" id="f-firstName" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>회사 (선택)</label>
        <input type="text" id="f-company" />
      </div>
      <div class="field">
        <label>국가코드 (예: KR, US, JP)</label>
        <input type="text" id="f-countryCode" maxlength="2" style="text-transform:uppercase;" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>우편번호</label>
        <input type="text" id="f-zip" />
      </div>
      <div class="field">
        <label>시/도 (주/현)</label>
        <input type="text" id="f-province" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>도시/구</label>
        <input type="text" id="f-city" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>주소</label>
        <input type="text" id="f-address1" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>아파트, 동/호수 등 (선택)</label>
        <input type="text" id="f-address2" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>전화</label>
        <input type="text" id="f-phone" />
      </div>
    </div>
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-actions">
      <button id="modal-cancel">취소</button>
      <button class="primary" id="modal-save">저장</button>
    </div>
  </div>
</div>

<div id="origin-modal" class="modal-overlay">
  <div class="modal-box origin-modal-box">
    <h2>원산지 확인 — GMI 수출신고 생성 전</h2>
    <p style="font-size:12px; color:var(--text-dim); margin-top:-8px;">
      빨간 테두리는 셀메이트에 원산지 코드가 없는 품목입니다. 직접 입력해주세요.
    </p>
    <div style="max-height:50vh; overflow-y:auto;">
      <table class="origin-table">
        <thead>
          <tr><th>주문번호</th><th>품목</th><th>SKU</th><th>원산지코드</th></tr>
        </thead>
        <tbody id="origin-table-body"></tbody>
      </table>
    </div>
    <div class="modal-error" id="origin-modal-error"></div>
    <div class="modal-actions">
      <button id="origin-modal-cancel">취소</button>
      <button class="primary" id="origin-modal-confirm">확인 후 엑셀 생성</button>
    </div>
  </div>
</div>

<script>
// ── 설정 ──────────────────────────────────────────────────────────
const SUPABASE_FUNCTIONS_BASE = "https://yqpskohzmnfiymjrgdxj.supabase.co/functions/v1";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxcHNrb2h6bW5maXltanJnZHhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjQwMTgsImV4cCI6MjA5NDAwMDAxOH0.D75U1e8JMvVI0K2Ccq5DwOliPg_rt-2uvKse1V2fiqw";
const GOOGLE_CLIENT_ID = "666157816733-0uu1dkoda0ljjslrd479j371snkj62t7.apps.googleusercontent.com";
const ALLOWED_DOMAIN = "geon.works";
const DEFAULT_WAREHOUSE_ID = 3; // 셀메이트 해외창고 id — 필요시 조정

let allOrders = [];
let processedOrders = [];
let processedLoaded = false;
let currentTab = "dhl";
let dhlReportMap = {}; // orderNumber -> { tracking, shipto, weight, freight, ct, country }
let selectedDhlOrderIds = new Set();

// ── 인증 ──────────────────────────────────────────────────────────
function handleCredentialResponse(response) {
  const payload = parseJwt(response.credential);
  if (!payload.email || !payload.email.endsWith("@" + ALLOWED_DOMAIN) || !payload.email_verified) {
    alert("@" + ALLOWED_DOMAIN + " 계정으로만 로그인할 수 있습니다.");
    return;
  }
  sessionStorage.setItem("user_email", payload.email);
  showApp(payload.email);
}

function parseJwt(token) {
  return JSON.parse(atob(token.split(".")[1]));
}

function showApp(email) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("main").classList.add("visible");
  document.getElementById("user-info").style.display = "flex";
  document.getElementById("user-email").textContent = email;
  loadOrders();
}

document.getElementById("logout-btn").addEventListener("click", () => {
  sessionStorage.removeItem("user_email");
  location.reload();
});

window.onload = () => {
  const savedEmail = sessionStorage.getItem("user_email");
  if (savedEmail) {
    showApp(savedEmail);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    hosted_domain: ALLOWED_DOMAIN,
  });
  google.accounts.id.renderButton(document.getElementById("g_id_signin"), {
    theme: "filled_black",
    size: "large",
  });
};

// ── Edge Function 호출 ──────────────────────────────────────────
async function callFunction(name, body) {
  const resp = await fetch(`${SUPABASE_FUNCTIONS_BASE}/${name}`, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify(body),
  });
  const json = await resp.json();
  if (!resp.ok || json.error) {
    throw new Error(json.error || `${name} 호출 실패`);
  }
  return json.data;
}

// ── 주문 로딩 및 분류 ────────────────────────────────────────────
async function loadOrders() {
  document.getElementById("table-container").innerHTML = '<div class="loading">주문을 불러오는 중...</div>';
  try {
    allOrders = await callFunction("shopify-orders", { action: "list" });
    document.getElementById("last-updated").textContent =
      "마지막 갱신: " + new Date().toLocaleTimeString("ko-KR");
    render();
  } catch (err) {
    document.getElementById("table-container").innerHTML =
      `<div class="empty-state">주문 조회 실패: ${escapeHtml(err.message)}</div>`;
  }
}

function isExcluded(order) {
  return order.lineItems.some(
    (li) => li.title && (li.title.startsWith("[Group Buy]") || li.title.startsWith("[Pre-Order]"))
  );
}

function classify(order) {
  if (isExcluded(order)) return "groupbuy";

  const method = (order.shippingMethod || "").toUpperCase();
  if (method.includes("DHL")) return "dhl";
  if (order.shippingMethod && order.shippingMethod.includes("국내")) return "domestic";

  // 배송방법 문구가 애매하거나("Shipping" 등) 없는 경우,
  // 배송지 국가코드로 최종 판단 (한국이면 국내, 그 외는 DHL 대상으로 간주)
  const country = order.shippingAddress?.countryCodeV2;
  if (country === "KR") return "domestic";
  return "dhl";
}

async function loadProcessedOrders() {
  document.getElementById("table-container").innerHTML = '<div class="loading">처리완료 주문을 불러오는 중...</div>';
  try {
    processedOrders = await callFunction("shopify-orders", { action: "list", status: "fulfilled" });
    processedLoaded = true;
    render();
  } catch (err) {
    document.getElementById("table-container").innerHTML =
      `<div class="empty-state">조회 실패: ${escapeHtml(err.message)}</div>`;
  }
}

function render() {
  const showDhlToolbar = currentTab === "dhl" || currentTab === "processed";
  document.getElementById("dhl-toolbar").style.display = showDhlToolbar ? "flex" : "none";
  document.getElementById("dhl-process-btn").style.display = currentTab === "dhl" ? "inline-block" : "none";

  if (currentTab === "processed") {
    const container = document.getElementById("table-container");
    if (processedOrders.length === 0) {
      container.innerHTML = '<div class="empty-state">최근 처리완료된 주문이 없습니다.</div>';
      return;
    }
    const rows = processedOrders.map((o) => renderRow(o, "processed")).join("");
    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th></th>
            <th>주문번호</th>
            <th>배송방법</th>
            <th>수령자 / 주소</th>
            <th>품목 (SKU)</th>
            <th>관세확인</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    bindDhlCheckboxes();
    return;
  }

  const grouped = { dhl: [], domestic: [], groupbuy: [] };
  for (const o of allOrders) grouped[classify(o)].push(o);

  document.getElementById("count-dhl").textContent = grouped.dhl.length;
  document.getElementById("count-domestic").textContent = grouped.domestic.length;
  document.getElementById("count-groupbuy").textContent = grouped.groupbuy.length;

  const list = grouped[currentTab];
  const container = document.getElementById("table-container");

  if (list.length === 0) {
    container.innerHTML = '<div class="empty-state">해당 탭에 주문이 없습니다.</div>';
    return;
  }

  const checkboxHeader = currentTab === "dhl" ? "<th></th>" : "";
  const rows = list.map((o) => renderRow(o, currentTab)).join("");
  container.innerHTML = `
    <table>
      <thead>
        <tr>
          ${checkboxHeader}
          <th>주문번호</th>
          <th>배송방법</th>
          <th>수령자 / 주소</th>
          <th>품목 (SKU)</th>
          <th>관세확인</th>
          <th>발송처리</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  // 이벤트 바인딩
  list.forEach((o) => bindRowEvents(o));
  if (currentTab === "dhl") bindDhlCheckboxes();
}

function badgeInfo(order, tab) {
  if (tab === "processed") {
    return { cls: "unknown", label: order.shippingMethod || "-" };
  }
  const method = (order.shippingMethod || "").toUpperCase();
  const isExplicit = method.includes("DHL") || (order.shippingMethod || "").includes("국내");
  if (isExplicit) {
    return { cls: tab, label: order.shippingMethod };
  }
  // 배송방법 문구가 애매해서 국가코드로 추론한 경우 — 추정임을 명확히 표시
  const label = tab === "dhl" ? "DHL (추정)" : "국내 (추정)";
  return { cls: tab, label };
}

function renderRow(order, tab) {
  const bi = badgeInfo(order, tab);
  const badgeClass = tab === "dhl" ? "dhl" : tab === "domestic" ? "domestic" : "unknown";

  const itemsHtml = order.lineItems
    .map((li) => {
      const skuHtml = li.sku
        ? `<span class="sku">${escapeHtml(li.sku)}</span>`
        : `<span class="no-sku">SKU 없음</span>`;
      return `${escapeHtml(li.title)} × ${li.quantity} — ${skuHtml}`;
    })
    .join("<br>");

  const addr = order.shippingAddress || {};
  const recipientName = [addr.firstName, addr.lastName].filter(Boolean).join(" ");
  const addrText = [recipientName, addr.address1, addr.address2, addr.city, addr.province, addr.country]
    .filter(Boolean)
    .join(", ");

  const editBtnHtml =
    tab === "processed" ? "" : `<div class="edit-btn" data-order-id="${order.id}">주소 수정</div>`;

  const noteHtml = order.note
    ? `<div class="note-badge" title="${escapeHtml(order.note)}">메모: ${escapeHtml(order.note.slice(0, 40))}</div>`
    : "";

  const fulfillControls =
    tab === "domestic"
      ? `
        <input type="text" placeholder="운송장번호" class="tracking-input" data-order-id="${order.id}" />
        <button class="primary fulfill-btn" data-order-id="${order.id}">발송처리</button>
        <div class="status-msg" id="status-${cssId(order.id)}"></div>
      `
      : tab === "processed"
      ? `<span style="color:var(--text-dim); font-size:12px;">${escapeHtml(order.fulfillmentStatus || "처리완료")}</span>`
      : tab === "dhl"
      ? renderDhlMatchStatus(order)
      : `<span style="color:var(--text-dim); font-size:12px;">DHL 리포트 업로드에서 일괄 처리</span>`;

  const checkboxCell =
    tab === "dhl" || tab === "processed"
      ? `<td><input type="checkbox" class="dhl-select" data-order-id="${order.id}" ${
          selectedDhlOrderIds.has(order.id) ? "checked" : ""
        } /></td>`
      : "";

  return `
    <tr data-order-id="${order.id}">
      ${checkboxCell}
      <td>
        <div class="order-no">${escapeHtml(order.orderNumber)}</div>
        <div style="font-size:11px; color:var(--text-dim);">${new Date(order.createdAt).toLocaleDateString("ko-KR")}</div>
        ${noteHtml}
      </td>
      <td><span class="badge ${badgeClass}">${escapeHtml(bi.label)}</span></td>
      <td>
        <div class="addr-box">
          ${escapeHtml(addrText)}
          ${editBtnHtml}
        </div>
      </td>
      <td><div class="items-list">${itemsHtml}</div></td>
      <td style="text-align:center;"><input type="checkbox" class="customs-check" /></td>
      <td>${fulfillControls}</td>
    </tr>
  `;
}

function renderDhlMatchStatus(order) {
  const match = dhlReportMap[order.orderNumber];
  const matchLine = match
    ? `<span style="color:var(--domestic);">송장 ${escapeHtml(match.tracking)}</span>`
    : `<span style="color:var(--text-dim);">리포트 미매칭</span>`;
  return `${matchLine}<div class="status-msg" id="status-${cssId(order.id)}"></div>`;
}

function bindDhlCheckboxes() {
  document.querySelectorAll(".dhl-select").forEach((cb) => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.orderId;
      if (cb.checked) selectedDhlOrderIds.add(id);
      else selectedDhlOrderIds.delete(id);
    });
  });
}

function cssId(id) {
  return id.replace(/[^a-zA-Z0-9]/g, "_");
}

function bindRowEvents(order) {
  const btn = document.querySelector(`.fulfill-btn[data-order-id="${cssAttr(order.id)}"]`);
  if (btn) {
    btn.addEventListener("click", () => handleDomesticFulfill(order));
  }
  const editBtn = document.querySelector(`.edit-btn[data-order-id="${cssAttr(order.id)}"]`);
  if (editBtn) {
    editBtn.addEventListener("click", () => handleAddressEdit(order));
  }
}

function cssAttr(id) {
  return id.replace(/"/g, '\\"');
}

// ── 국내 배송건: 운송장 입력 → 발송처리 + 재고차감 ─────────────────
async function handleDomesticFulfill(order) {
  const input = document.querySelector(`.tracking-input[data-order-id="${cssAttr(order.id)}"]`);
  const statusEl = document.getElementById(`status-${cssId(order.id)}`);
  const tracking = input.value.trim();

  if (!tracking) {
    statusEl.textContent = "운송장번호를 입력해주세요.";
    statusEl.className = "status-msg err";
    return;
  }
  if (!order.fulfillmentOrderIds || order.fulfillmentOrderIds.length === 0) {
    statusEl.textContent = "이 주문에 연결된 fulfillment order가 없습니다.";
    statusEl.className = "status-msg err";
    return;
  }

  const btn = document.querySelector(`.fulfill-btn[data-order-id="${cssAttr(order.id)}"]`);
  btn.disabled = true;
  statusEl.textContent = "처리 중...";
  statusEl.className = "status-msg";

  try {
    // 1) Shopify 발송처리
    await callFunction("shopify-orders", {
      action: "fulfill",
      fulfillmentOrderId: order.fulfillmentOrderIds[0],
      trackingNumber: tracking,
      carrier: "우체국택배",
    });

    // 2) 셀메이트 재고차감
    const skuItems = order.lineItems
      .filter((li) => li.sku)
      .map((li) => ({ sku: li.sku, quantity: li.quantity }));

    let deductResult = null;
    if (skuItems.length > 0) {
      deductResult = await callFunction("sellmate-stock", {
        action: "deduct",
        warehouseId: DEFAULT_WAREHOUSE_ID,
        items: skuItems,
        note: `Shopify ${order.orderNumber}`,
      });
    }

    const unmatched = deductResult?.unmatchedSkus || [];
    if (unmatched.length > 0) {
      statusEl.textContent = `발송처리 완료. ⚠ SKU 매칭 실패: ${unmatched.join(", ")} (재고 수동 확인 필요)`;
      statusEl.className = "status-msg err";
    } else {
      statusEl.textContent = "발송처리 + 재고차감 완료";
      statusEl.className = "status-msg ok";
    }

    // 목록에서 제거 (다음 새로고침 전까지 처리됨 표시)
    setTimeout(() => loadOrders(), 1500);
  } catch (err) {
    statusEl.textContent = "실패: " + err.message;
    statusEl.className = "status-msg err";
    btn.disabled = false;
  }
}

// ── 주소 수정 (모달 기반) ─────────────────────────────────────────
let addressEditOrder = null;

function handleAddressEdit(order) {
  addressEditOrder = order;
  const addr = order.shippingAddress || {};

  document.getElementById("modal-order-no").textContent = order.orderNumber;
  document.getElementById("f-lastName").value = addr.lastName || "";
  document.getElementById("f-firstName").value = addr.firstName || "";
  document.getElementById("f-company").value = addr.company || "";
  document.getElementById("f-countryCode").value = addr.countryCodeV2 || "";
  document.getElementById("f-zip").value = addr.zip || "";
  document.getElementById("f-province").value = addr.province || "";
  document.getElementById("f-city").value = addr.city || "";
  document.getElementById("f-address1").value = addr.address1 || "";
  document.getElementById("f-address2").value = addr.address2 || "";
  document.getElementById("f-phone").value = addr.phone || "";
  document.getElementById("modal-error").textContent = "";

  document.getElementById("address-modal").classList.add("visible");
}

function closeAddressModal() {
  document.getElementById("address-modal").classList.remove("visible");
  addressEditOrder = null;
}

document.getElementById("modal-cancel").addEventListener("click", closeAddressModal);

document.getElementById("modal-save").addEventListener("click", async () => {
  if (!addressEditOrder) return;
  const errorEl = document.getElementById("modal-error");
  const saveBtn = document.getElementById("modal-save");

  const address = {
    lastName: document.getElementById("f-lastName").value.trim(),
    firstName: document.getElementById("f-firstName").value.trim(),
    company: document.getElementById("f-company").value.trim(),
    countryCodeV2: document.getElementById("f-countryCode").value.trim().toUpperCase(),
    zip: document.getElementById("f-zip").value.trim(),
    province: document.getElementById("f-province").value.trim(),
    city: document.getElementById("f-city").value.trim(),
    address1: document.getElementById("f-address1").value.trim(),
    address2: document.getElementById("f-address2").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
  };

  if (!address.address1 || !address.city || !address.zip) {
    errorEl.textContent = "주소, 도시, 우편번호는 필수입니다.";
    return;
  }

  saveBtn.disabled = true;
  errorEl.textContent = "";

  try {
    await callFunction("shopify-orders", {
      action: "updateAddress",
      orderId: addressEditOrder.id,
      address,
    });
    closeAddressModal();
    loadOrders();
  } catch (err) {
    errorEl.textContent = "저장 실패: " + err.message;
  } finally {
    saveBtn.disabled = false;
  }
});

// ── 탭 전환 / 새로고침 ───────────────────────────────────────────
document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.tab;
    if (currentTab === "processed" && !processedLoaded) {
      loadProcessedOrders();
    } else {
      render();
    }
  });
});

document.getElementById("refresh-btn").addEventListener("click", loadOrders);

// ── DHL 리포트 업로드 및 파싱 ──────────────────────────────────────
document.getElementById("dhl-report-input").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById("dhl-report-status");
  statusEl.textContent = "파싱 중...";

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });

    dhlReportMap = {};
    // rows[0]은 헤더. 1행부터 데이터.
    // 컬럼 인덱스는 기존 PackageSentReport 포맷 기준:
    // 0 ShipTo, 1 OurRef, 5 Weight, 16 TrackingNumber, 35 Freight Charge, 40 Number of packages sent
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const ref = (row[1] || "").toString().trim();
      if (!ref) continue;
      dhlReportMap[ref] = {
        tracking: (row[16] || "").toString().trim(),
        shipto: (row[0] || "").toString().trim(),
        weight: (row[5] || "").toString().trim(),
        freight: (row[35] || "").toString().trim(),
        ct: (row[40] || "1").toString().trim(),
      };
    }

    statusEl.textContent = `${Object.keys(dhlReportMap).length}건 매칭 데이터 로드됨`;
    render(); // 매칭 상태 갱신
  } catch (err) {
    statusEl.textContent = "파싱 실패: " + err.message;
  }
});

// ── 선택 주문 일괄 발송처리 + 재고차감 ─────────────────────────────
document.getElementById("dhl-process-btn").addEventListener("click", async () => {
  const logEl = document.getElementById("dhl-log");
  const targets = allOrders.filter(
    (o) => classify(o) === "dhl" && selectedDhlOrderIds.has(o.id)
  );

  if (targets.length === 0) {
    logEl.innerHTML = '<span style="color:var(--danger);">선택된 주문이 없습니다.</span>';
    return;
  }

  logEl.innerHTML = `처리 시작: 총 ${targets.length}건`;

  for (const order of targets) {
    const match = dhlReportMap[order.orderNumber];
    const statusEl = document.getElementById(`status-${cssId(order.id)}`);

    if (!match || !match.tracking) {
      if (statusEl) {
        statusEl.textContent = "DHL 리포트에 매칭되는 송장 없음 — 스킵";
        statusEl.className = "status-msg err";
      }
      continue;
    }
    if (!order.fulfillmentOrderIds || order.fulfillmentOrderIds.length === 0) {
      if (statusEl) {
        statusEl.textContent = "fulfillment order 없음 — 스킵";
        statusEl.className = "status-msg err";
      }
      continue;
    }

    if (statusEl) {
      statusEl.textContent = "처리 중...";
      statusEl.className = "status-msg";
    }

    try {
      await callFunction("shopify-orders", {
        action: "fulfill",
        fulfillmentOrderId: order.fulfillmentOrderIds[0],
        trackingNumber: match.tracking,
        carrier: "DHL Express",
      });

      const skuItems = order.lineItems
        .filter((li) => li.sku)
        .map((li) => ({ sku: li.sku, quantity: li.quantity }));

      let deductResult = null;
      if (skuItems.length > 0) {
        deductResult = await callFunction("sellmate-stock", {
          action: "deduct",
          warehouseId: DEFAULT_WAREHOUSE_ID,
          items: skuItems,
          note: `Shopify ${order.orderNumber} (DHL)`,
        });
      }

      const unmatched = deductResult?.unmatchedSkus || [];
      if (statusEl) {
        if (unmatched.length > 0) {
          statusEl.textContent = `발송처리 완료. ⚠ SKU 매칭 실패: ${unmatched.join(", ")}`;
          statusEl.className = "status-msg err";
        } else {
          statusEl.textContent = "발송처리 + 재고차감 완료";
          statusEl.className = "status-msg ok";
        }
      }
    } catch (err) {
      if (statusEl) {
        statusEl.textContent = "실패: " + err.message;
        statusEl.className = "status-msg err";
      }
    }
  }

  logEl.innerHTML = `처리 완료: 총 ${targets.length}건 (개별 결과는 표 안 각 행에서 확인)`;
  setTimeout(() => loadOrders(), 2000);
});

// ── 출고분 / GMI 수출신고 엑셀 생성 ────────────────────────────────
let originReviewTargets = [];

document.getElementById("dhl-export-btn").addEventListener("click", async () => {
  const sourceList = currentTab === "processed" ? processedOrders : allOrders.filter((o) => classify(o) === "dhl");
  const targets = sourceList.filter((o) => selectedDhlOrderIds.has(o.id));
  if (targets.length === 0) {
    alert("엑셀로 생성할 주문을 먼저 체크박스로 선택해주세요.");
    return;
  }

  originReviewTargets = targets;

  const skus = [...new Set(targets.flatMap((o) => o.lineItems.filter((li) => li.sku).map((li) => li.sku)))];
  let lookup = {};
  try {
    lookup = await callFunction("sellmate-stock", { action: "lookupProducts", skus });
  } catch (err) {
    alert("원산지 조회 실패: " + err.message + " — 빈 값으로 진행합니다.");
  }

  openOriginModal(targets, lookup);
});

function openOriginModal(targets, lookup) {
  const tbody = document.getElementById("origin-table-body");
  const rowsHtml = [];
  for (const order of targets) {
    for (const li of order.lineItems) {
      if (!li.sku) continue;
      const info = lookup[li.sku];
      const origin = info?.originCode || "";
      rowsHtml.push(`
        <tr class="${origin ? "" : "missing"}" data-sku="${escapeHtml(li.sku)}">
          <td>${escapeHtml(order.orderNumber)}</td>
          <td>${escapeHtml(li.title)}</td>
          <td>${escapeHtml(li.sku)}</td>
          <td><input type="text" class="origin-input" data-sku="${escapeHtml(li.sku)}" value="${escapeHtml(origin)}" maxlength="2" /></td>
        </tr>
      `);
    }
  }
  tbody.innerHTML = rowsHtml.join("");
  document.getElementById("origin-modal-error").textContent = "";
  document.getElementById("origin-modal").classList.add("visible");
}

document.getElementById("origin-modal-cancel").addEventListener("click", () => {
  document.getElementById("origin-modal").classList.remove("visible");
});

document.getElementById("origin-modal-confirm").addEventListener("click", () => {
  const errorEl = document.getElementById("origin-modal-error");
  const originMap = {};
  let hasMissing = false;

  document.querySelectorAll(".origin-input").forEach((input) => {
    const val = input.value.trim().toUpperCase();
    originMap[input.dataset.sku] = val;
    if (!val) hasMissing = true;
  });

  if (hasMissing) {
    errorEl.textContent = "비어있는 원산지코드가 있습니다. 모두 입력해주세요.";
    return;
  }

  document.getElementById("origin-modal").classList.remove("visible");
  exportChulgobon(originReviewTargets);
  exportGmi(originReviewTargets, originMap);
});

function exportChulgobon(orders) {
  const rows = [["주문번호", "송장번호", "무게(kg)", "수령인", "품목", "수량"]];
  for (const order of orders) {
    const match = dhlReportMap[order.orderNumber] || {};
    let first = true;
    for (const li of order.lineItems) {
      rows.push([
        first ? order.orderNumber : "",
        first ? match.tracking || "" : "",
        first ? match.weight || "" : "",
        first ? match.shipto || "" : "",
        li.title,
        li.quantity,
      ]);
      first = false;
    }
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "출고분");
  const today = new Date();
  const fname = `${today.getMonth() + 1}월 ${today.getDate()}일 출고분.xlsx`;
  XLSX.writeFile(wb, fname);
}

function exportGmi(orders, originMap) {
  const header = [
    "AWB NO", "구매자", "목적국", "CT", "총중량", "수량", "단가", "금액", "총신고금액",
    "신고품명", "HS CODE", "모델명(규격)", "인도조건", "화폐단위", "환급유무", "원산지",
    "송품장번호", "거래구분", "사업자번호(수출자)", "사업자번호(제조자)",
  ];
  const rows = [header];

  for (const order of orders) {
    const match = dhlReportMap[order.orderNumber];
    if (!match) continue;
    const country = order.shippingAddress?.country || "";
    const recipientName =
      match.shipto ||
      [order.shippingAddress?.firstName, order.shippingAddress?.lastName].filter(Boolean).join(" ");

    const itemLines = order.lineItems.filter((li) => li.sku);
    let blockTotal = 0;
    let firstRow = true;

    for (const li of itemLines) {
      const amount = (li.price || 0) * li.quantity;
      blockTotal += amount;
      rows.push([
        firstRow ? match.tracking || "" : "",
        firstRow ? recipientName.toUpperCase() : "",
        firstRow ? country : "",
        firstRow ? match.ct || "1" : "",
        firstRow ? match.weight || "" : "",
        li.quantity,
        li.price || "",
        amount || "",
        "", // 총신고금액은 블록 마지막에 채움
        "KEYBOARD PARTS",
        "8473.30-9000",
        li.title,
        "DAP",
        "USD",
        "Y",
        originMap[li.sku] || "",
        "", // 송품장번호
        15, // 거래구분 (고정값)
        1304377108, // 사업자번호(수출자) (고정값)
        "미상", // 사업자번호(제조자) (고정값)
      ]);
      firstRow = false;
    }

    if (match.freight && parseFloat(match.freight) > 0) {
      const shippingAmount = parseFloat(match.freight);
      blockTotal += shippingAmount;
      rows.push([
        firstRow ? match.tracking || "" : "",
        firstRow ? recipientName.toUpperCase() : "",
        firstRow ? country : "",
        firstRow ? match.ct || "1" : "",
        firstRow ? match.weight || "" : "",
        1,
        shippingAmount,
        shippingAmount,
        "",
        "SHIPPING FEE",
        "",
        "SHIPPING FEE",
        "DAP",
        "USD",
        "Y",
        "",
        "",
        15,
        1304377108,
        "미상",
      ]);
    }

    // 총신고금액은 이 오더 블록의 첫 데이터 행에 기입 (원본은 병합+수식이었으나 여기선 단순 합산값)
    const blockStartIdx = rows.length - itemLines.length - (match.freight && parseFloat(match.freight) > 0 ? 1 : 0);
    if (rows[blockStartIdx]) rows[blockStartIdx][8] = blockTotal;
  }

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  const today = new Date();
  const mmdd = `${String(today.getMonth() + 1).padStart(2, "0")}${String(today.getDate()).padStart(2, "0")}`;
  XLSX.writeFile(wb, `GMI_DEC 수출신고요청_${orders.length}건_${mmdd}.xlsx`);
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
